name: Aegis Runtime Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_key: linux-x64
          - os: macos-15-intel
            platform_key: darwin-x64
          - os: windows-2022
            platform_key: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout private release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: lemkyz/aegis-core
          ref: 5ae234c3d5272b2283b46b067484ff845a9953cf
          token: ${{ secrets.AEGIS_CORE_READ_TOKEN }}
          persist-credentials: false
          path: core

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml

      - name: Install runtime build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./core/backend
          python -m pip install "Nuitka==4.1.3" ordered-set zstandard

      - name: Build and smoke-test native runtime
        shell: bash
        env:
          AEGIS_FINGERPRINT_KEY: public-builder-${{ github.run_id }}-${{ matrix.platform_key }}-not-production-secret
        run: |
          cd core
          python scripts/ci_build_runtime.py

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.platform_key }}
          path: |
            core/runtime-ci/aegis-runtime-${{ matrix.platform_key }}.tar.gz
            core/runtime-ci/${{ matrix.platform_key }}.json
          if-no-files-found: error
          retention-days: 1
