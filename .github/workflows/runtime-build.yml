name: Aegis Runtime Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_key: linux-x64
          - os: macos-15-intel
            platform_key: darwin-x64
          - os: windows-2022
            platform_key: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fetch exact private release candidate
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.AEGIS_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail

          mkdir core
          git -C core init
          git -C core remote add origin https://github.com/lemkyz/aegis-core.git

          ASKPASS="$PWD/.aegis-git-askpass.sh"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "lemkyz" ;;' \
            '  *Password*) printf "%s\n" "$CORE_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' \
            > "$ASKPASS"

          chmod 700 "$ASKPASS"

          GIT_ASKPASS="$ASKPASS" \
          GIT_TERMINAL_PROMPT=0 \
            git -C core fetch --no-tags --depth=1 origin main

          rm -f "$ASKPASS"

          git -C core checkout --detach FETCH_HEAD

          ACTUAL_SHA="$(git -C core rev-parse HEAD)"
          EXPECTED_SHA="5ae234c3d5272b2283b46b067484ff845a9953cf"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          unset CORE_TOKEN
          echo "PRIVATE_RELEASE_COMMIT_VERIFIED"

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml

      - name: Install runtime build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./core/backend
          python -m pip install "Nuitka==4.1.3" ordered-set zstandard

      - name: Build and smoke-test native runtime
        shell: bash
        env:
          AEGIS_FINGERPRINT_KEY: public-builder-${{ github.run_id }}-${{ matrix.platform_key }}-not-production-secret
        run: |
          cd core
          python scripts/ci_build_runtime.py

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.platform_key }}
          path: |
            core/runtime-ci/aegis-runtime-${{ matrix.platform_key }}.tar.gz
            core/runtime-ci/${{ matrix.platform_key }}.json
          if-no-files-found: error
          retention-days: 1
