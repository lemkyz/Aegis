name: Product bug
description: Report a reproducible non-security Aegis product issue
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for vulnerabilities, secrets, or private customer data.
  - type: input
    id: version
    attributes:
      label: Aegis version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal safe steps to reproduce.
    validations:
      required: true
